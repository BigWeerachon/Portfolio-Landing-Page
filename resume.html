<style>
:root{--ink:#171717;--muted:#50555E;--line:#E4E5EA;--bg:#F5F5F7}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Google Sans","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.bar{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:6px;padding:5px;border-radius:999px;background:rgba(228,232,239,.97);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 6px 24px rgba(23,23,23,.08);max-width:calc(100% - 24px)}
.bar a,.bar button{font:inherit;font-size:14px;font-weight:500;text-decoration:none;border:0;cursor:pointer;border-radius:999px;padding:8px 16px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.back{color:var(--muted);background:transparent}
.back:hover{color:var(--ink)}
.dl{background:#131922;color:#fff}
.dl:hover{background:#000}
.lgb{display:flex;gap:2px;margin-left:2px;border:0;background:rgba(19,25,34,.06);border-radius:999px;padding:3px!important;cursor:pointer}
.lgb b{font-size:12px;font-weight:600;padding:5px 9px;border-radius:999px;color:#8D9197}
.lgb b.on{background:#fff;color:var(--ink)}
main{max-width:920px;margin:0 auto;padding:100px 20px 72px}
.head{text-align:center;margin:0 0 28px}
.kick{font-size:13px;color:#8D9197;letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px}
h1{margin:0;font-size:clamp(36px,6vw,64px);font-weight:500;letter-spacing:-.03em;line-height:1.05}
h1 span{background:linear-gradient(90deg,#4F7CFF,#9B5CFF 60%,#D45CFF);-webkit-background-clip:text;background-clip:text;color:transparent}
.sheet{display:block;width:100%;height:auto;border-radius:14px;background:#fff;box-shadow:0 1px 2px rgba(19,25,34,.06),0 24px 60px -24px rgba(19,25,34,.28)}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:28px}
.btn{font:inherit;font-size:15px;font-weight:500;text-decoration:none;border-radius:999px;padding:12px 22px;display:inline-flex;align-items:center;gap:8px}
.btn.pri{background:#131922;color:#fff}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn:hover{transform:translateY(-1px)}
.btn,.bar a{transition:transform .2s,background .2s,color .2s}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s cubic-bezier(.2,.8,.2,1),transform .7s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}
.ts{display:none}
@media (max-width:640px){
 .bar{left:12px;right:12px;transform:none;max-width:none;padding:6px 6px 6px 8px;gap:8px}
 .back{flex:1;min-width:0;font-size:16px!important;font-weight:600!important;color:var(--ink)!important;padding:10px 10px!important}
 .back .t{display:none}.back .ts{display:inline}
 .lgb b{padding:7px 11px;font-size:13px}
 .dl{order:3;width:44px;height:44px;padding:0!important;justify-content:center}
 .dl .dlt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
 .dl svg{width:20px;height:20px}
}
@media (max-width:520px){
 main{padding:84px 12px 48px}
 .sheet{border-radius:10px}
}
@media print{.bar,.actions,.head{display:none}main{padding:0}.sheet{box-shadow:none;border-radius:0}}
</style>
</head>

<nav class="bar" aria-label="Resume">
 <a class="back" href="index.html" aria-label="Back to portfolio"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg><span class="t" data-i18n="back">Back to portfolio</span><span class="ts" data-i18n="backs">Portfolio</span></a>
 <a class="dl" href="assets/resume/Weerachon_Kammoon_Resume.pdf" download><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M6 10l6 6 6-6M5 20h14"/></svg><span class="dlt" data-i18n="dl">Download PDF</span></a>
 <button type="button" class="lgb" id="lgb" aria-label="Switch language"><b data-l="th">TH</b><b data-l="en" class="on">EN</b></button>
</nav>
<main>
 <header class="head reveal">
  <p class="kick" data-i18n="kick">Weerachon Kammoon</p>
  <h1><span data-i18n="title">Resume</span></h1>
 </header>
 <a href="assets/resume/Weerachon_Kammoon_Resume.pdf" target="_blank" rel="noopener" class="reveal" aria-label="Open the resume PDF">
  <img class="sheet" src="assets/resume/resume.webp" srcset="assets/resume/resume-1000.webp 1000w, assets/resume/resume.webp 1820w" sizes="(max-width:920px) 100vw, 880px" width="1820" height="2574" alt="Resume of Weerachon Kammoon, Product Owner / Senior UX/UI Designer: profile, experience at Jabjai, Jupiter Professional Services, Virtual Link Solutions, Codediva and E.S.M. Solution, core skills, tools and education.">
 </a>
 <div class="actions reveal">
  <a class="btn pri" href="assets/resume/Weerachon_Kammoon_Resume.pdf" download><span data-i18n="dl">Download PDF</span></a>
  <a class="btn sec" href="index.html#contact"><span data-i18n="contact">Contact me</span></a>
 </div>
</main>
<script>
const T={en:{back:"Back to portfolio",backs:"Portfolio",dl:"Download PDF",kick:"Weerachon Kammoon",title:"Resume",contact:"Contact me"},
th:{back:"กลับไปหน้าพอร์ต",backs:"พอร์ตโฟลิโอ",dl:"ดาวน์โหลด PDF",kick:"วีรชน คำมูล",title:"เรซูเม่",contact:"ติดต่อ"}};
function setLang(l){document.querySelectorAll('[data-i18n]').forEach(e=>{const v=T[l][e.dataset.i18n];if(v)e.textContent=v});document.querySelectorAll('#lgb b').forEach(b=>b.classList.toggle('on',b.dataset.l===l));document.documentElement.lang=l;try{localStorage.setItem('lang',l)}catch(e){}}
document.getElementById('lgb').addEventListener('click',()=>setLang(document.documentElement.lang==='th'?'en':'th'));
let l='en';try{l=new URLSearchParams(location.search).get('lang')||localStorage.getItem('lang')||'en'}catch(e){}
if(l==='th')setLang('th');
const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.05}):null;
document.querySelectorAll('.reveal').forEach((e,i)=>{e.style.transitionDelay=(i*90)+'ms';io?io.observe(e):e.classList.add('in')});
</script>
